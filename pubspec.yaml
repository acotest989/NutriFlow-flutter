name: nutriflow
description: "NutriFlow - diet, hydration and exercise tracker"
publish_to: 'none'

# versionName+versionCode on Google Play. Continues the TWA's numbering
# (last TWA release: 1.0.3 / versionCode 4).
version: 2.0.0+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.18.0
  flutter_riverpod: ^3.4.3
  firebase_core: ^4.15.0
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8
  google_sign_in: ^7.2.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  intl: ^0.20.2
  fl_chart: ^1.2.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  connectivity_plus: ^7.3.2
  package_info_plus: ^10.2.2
  lucide_icons_flutter: ^3.1.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

# `dart run flutter_launcher_icons` — launcher + adaptive icon from the web icons.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/icon-512.png
  adaptive_icon_background: assets/icons/adaptive-bg.png
  adaptive_icon_foreground: assets/icons/adaptive-fg.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24

# `dart run flutter_native_splash:create` — native launch splash.
flutter_native_splash:
  color: "#0B0E14"
  image: assets/icons/icon-512.png
  android_12:
    color: "#0B0E14"
    image: assets/icons/splash-android12.png
  ios: false
  web: false
